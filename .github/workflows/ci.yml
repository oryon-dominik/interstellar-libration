# Repository hygiene, whatever the language: the hooks of .pre-commit-config.yaml and a
# secret scan over the pushed history. Nothing here assumes a directory or a pyproject.toml.
#
# The scan is its own step because the gitleaks hook runs `--staged` — in a
# checkout nothing is staged, so under prek it passes without reading a line.
name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the push's range, and the whole history when there is none

      - name: Run the hooks
        uses: j178/prek-action@v3.0.0

      # The step above runs the pre-commit stage only: commitlint and commit-scope never
      # read a header in CI (measured 2026-10-07), so a clone without the commit-msg shim
      # pushed whatever header it liked. Work lands on trunk without pull requests,
      # so every pushed commit goes through the commit-msg stage here — the same hooks,
      # the same pinned rules — before a release writes the changelog. Merges are left
      # out: their header is the tool's, not the author's.
      - name: Check every pushed commit header
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # A branch's first push has no before; there is no range to read.
          if [[ "$BASE" =~ ^0+$ ]]; then exit 0; fi
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-message"
            if ! prek run --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/commit-message"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") carries a header the hooks refuse"
              status=1
            fi
          done
          exit $status

      # Only what this push or pull request brings is read; what the history already carries
      # is not read again. A branch's first push, a missing base, or a force push whose old
      # head left the clone names no range — then the whole history is read.
      - name: Scan the pushed commits for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          curl --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --quiet
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          range=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range=(--log-opts="$BASE..$HEAD")
          fi
          ./gitleaks git --redact --no-banner "${range[@]}" .

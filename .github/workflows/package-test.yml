# The package's own gate, beside the hygiene workflow (ci.yml): lint,
# format and the test suite against the locked dependencies.
name: Test

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  # The release workflow runs this gate before it mints a number.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor, on the locked dependencies: this row gates a release.
          - python: "3.14"
            newest: false
          # The newest stable Python on the newest dependencies, whichever they are: a warning
          # ahead of an upgrade. Nothing waits for it, and a new Python needs no edit here.
          - python: ">=3.14"
            newest: true
    continue-on-error: ${{ matrix.newest }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      # Only uv's own builds: a Python the runner happens to carry would satisfy the request.
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v7

      # No setup-python step: uv downloads the interpreter UV_PYTHON names if it is missing.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Newest dependencies
        if: ${{ matrix.newest }}
        run: uv lock --upgrade

      - name: Install
        # Groups as well as extras: a public library keeps its tools in dependency groups,
        # which no consumer installs.
        run: uv sync --all-extras --all-groups --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

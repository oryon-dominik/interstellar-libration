# Put a release on the Python Package Index. A deliberate act: started by hand, from a tag
# the release workflow minted, and held at the `pypi` environment until a reviewer approves.
# Trusted Publishing proves who uploads, so no token is stored anywhere.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Spelled out, so a branch of the same name can never stand in for the tag.
          ref: refs/tags/${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Build the wheel and the source distribution
        run: uv build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The identity the index trusts. Only this job holds it, and it runs no project code.
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist/

      # Pinned to a commit: this step holds the identity, and a tag can move.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
